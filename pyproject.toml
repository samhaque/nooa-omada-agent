[project]
name = "nooa-omada-agent"
version = "0.2.0"
description = "NOOA network-ops agent for a TP-Link Omada SDN controller (via omada-controller-mcp), backed by a self-hosted Nemotron Lightning 30B A3B NIM"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa[mcp]>=0.1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omada_agent"]
